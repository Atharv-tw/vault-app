# Builds what people download: the `myvault` command and the desktop app for
# Linux and Windows, the Android app and the GNOME extension. A tag like v0.2.0 publishes them as a GitHub
# Release; a pull request that touches this file only builds them, as a check.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/install.ps1', 'apps/app/windows/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  linux:
    # The oldest runner on offer, so the programs start on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: The myvault command
        working-directory: cli
        run: |
          dart pub get
          dart build cli
          tar -czf "$GITHUB_WORKSPACE/myvault-cli-linux-x64.tar.gz" -C build/cli/linux_x64 bundle

      - name: The desktop app
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build linux --release
          cp ../../assets/logo.svg build/linux/x64/release/bundle/vault.svg
          tar -czf "$GITHUB_WORKSPACE/vault-app-linux-x64.tar.gz" -C build/linux/x64/release bundle

      - name: The GNOME extension
        # metadata.json at the top of the archive, as `gnome-extensions install` wants.
        run: (cd gnome-extension/myvault@atharv.local && zip -qr "$GITHUB_WORKSPACE/vault-gnome-extension.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            myvault-cli-linux-x64.tar.gz
            vault-app-linux-x64.tar.gz
            vault-gnome-extension.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: The myvault command
        working-directory: cli
        shell: pwsh
        run: |
          dart pub get
          dart build cli
          Compress-Archive -Path build/cli/windows_x64/bundle -DestinationPath "$env:GITHUB_WORKSPACE/myvault-cli-windows-x64.zip"

      - name: The command starts
        shell: pwsh
        run: |
          Expand-Archive myvault-cli-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/check"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP/data"
          & "$env:RUNNER_TEMP/check/bundle/bin/myvault.exe" add "Check the Windows build" -d today
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP/check/bundle/bin/myvault.exe" list today
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The desktop app
        working-directory: apps/app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          Rename-Item build/windows/x64/runner/Release bundle
          Compress-Archive -Path build/windows/x64/runner/bundle -DestinationPath "$env:GITHUB_WORKSPACE/vault-app-windows-x64.zip"

      # The installer as people run it, in Windows PowerShell 5.1, against
      # the files just built, served the way a release serves them.
      - name: The installer works
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/release" | Out-Null
          Copy-Item myvault-cli-windows-x64.zip, vault-app-windows-x64.zip "$env:RUNNER_TEMP/release"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', "$env:RUNNER_TEMP/release" -PassThru
          Start-Sleep -Seconds 3
          $env:MYVAULT_RELEASE = 'http://127.0.0.1:8765'
          & ([scriptblock]::Create((Get-Content -Raw scripts/install.ps1))) -NoSetup
          Stop-Process $server.Id
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\Vault\myvault\bin\myvault.exe'
          & $bin list today
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Vault\vault-app\vault.exe'))) { throw 'The app was not installed.' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Vault.lnk'))) { throw 'No Start menu shortcut.' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            myvault-cli-windows-x64.zip
            vault-app-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # With the four ANDROID_* secrets set, every release is signed with the
      # same key and installs over the last one. Without them the build is
      # signed with a throwaway key and has to be installed fresh each time.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key set; this APK cannot update an installed one."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/app/android/key.properties

      - name: The Android app
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/vault-android-arm64.apk"
          cp app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/vault-android-arm32.apk"
          cp app-x86_64-release.apk "$GITHUB_WORKSPACE/vault-android-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: vault-android-*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            myvault-cli-linux-x64.tar.gz vault-app-linux-x64.tar.gz vault-gnome-extension.zip vault-android-*.apk \
            myvault-cli-windows-x64.zip vault-app-windows-x64.zip
